name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      offline_es:
        description: "Incluir mapa offline do Espírito Santo (125 MB)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bundle immediate equipment data
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/equipment
          base=https://raw.githubusercontent.com/murkiriel/pardal/main
          for file in radares lombadas; do
            curl -fL --retry 2 --max-time 30 "$base/estados/ES/$file.csv" -o "app/src/main/assets/equipment/ES-$file.csv"
            test -s "app/src/main/assets/equipment/ES-$file.csv"
          done
          if curl -fL --retry 2 --max-time 30 "$base/catalogo.json" -o app/src/main/assets/equipment/catalogo.json; then
            python3 - <<'PY'
          import concurrent.futures, json, pathlib, urllib.request
          root=pathlib.Path("app/src/main/assets/equipment")
          base="https://raw.githubusercontent.com/murkiriel/pardal/main/estados"
          states=json.loads((root/"catalogo.json").read_text())["ufs"]
          jobs=[(uf,name) for uf in states if len(uf)==2 and uf not in ("BR","ES") for name in ("radares","lombadas")]
          def fetch(job):
              uf,name=job
              try:
                  with urllib.request.urlopen(f"{base}/{uf}/{name}.csv",timeout=25) as r: data=r.read(20_000_001)
                  if len(data)>20_000_000 or b"lat" not in data.splitlines()[0] or b"lng" not in data.splitlines()[0]: return
                  (root/f"{uf}-{name}.csv").write_bytes(data)
              except Exception as e: print(f"{uf}/{name}: {e}")
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool: list(pool.map(fetch,jobs))
          print("Cadastros estaduais:", len(list(root.glob("*.csv"))))
          PY
          fi
          printf "%s\n" "Pardal — dados ODbL 1.0, OpenStreetMap e fontes oficiais. https://github.com/murkiriel/pardal" > app/src/main/assets/equipment/LICENSE.txt
      - name: Prepare national health index
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --user ijson
          curl -fL --retry 2 --max-time 240 'https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/CNES/cnes_estabelecimentos_json.zip' -o /tmp/cnes.zip
          curl -fL --retry 2 --max-time 60 'https://servicodados.ibge.gov.br/api/v1/localidades/municipios' -o /tmp/municipios.json
          python3 scripts/build_health_index.py /tmp/cnes.zip app/src/main/assets/national/cnes.sqlite /tmp/municipios.json
          echo "CNES nacional incluído" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare offline map of Espírito Santo
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.offline_es }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/offline/recursos
          base='https://github.com/murkiriel/carcara/releases/download/2026-11-22-4b152427'
          curl -fL --retry 3 --max-time 300 "$base/carcara-ES-leve.pmtiles" -o app/src/main/assets/offline/carcara-ES-leve.pmtiles
          echo 'f1c74c74658ba0e790e157e964d7a84e96150511ed204596b11c61742b96d26a  app/src/main/assets/offline/carcara-ES-leve.pmtiles' | sha256sum -c -
          curl -fL --retry 3 --max-time 180 "$base/carcara-recursos.tar.gz" -o /tmp/carcara-recursos.tar.gz
          echo '2c96f4186eb606e35ee25e0e31317916e4a860e201f0f4ae91a3bb4fb8fbaf1e  /tmp/carcara-recursos.tar.gz' | sha256sum -c -
          tar -xzf /tmp/carcara-recursos.tar.gz -C app/src/main/assets/offline/recursos
          test -s app/src/main/assets/offline/recursos/styles/light.json
          test -s app/src/main/assets/offline/recursos/styles/dark.json
          curl -fL --retry 3 "$base/LICENCA-DADOS.txt" -o app/src/main/assets/offline/LICENCA-DADOS.txt
      - name: Compile and verify
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
          cp app/build/outputs/apk/debug/app-debug.apk Rota_Unica.apk
          test -s Rota_Unica.apk
          unzip -l Rota_Unica.apk | grep "assets/equipment/ES-radares.csv"
          unzip -tq Rota_Unica.apk
          sha256sum Rota_Unica.apk
          ls -lh Rota_Unica.apk
          echo "### Rota Única — tamanho do APK" >> "$GITHUB_STEP_SUMMARY"
          du -h Rota_Unica.apk >> "$GITHUB_STEP_SUMMARY"
          unzip -l Rota_Unica.apk | grep -E 'lib/.+[.]so$' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Rota_Unica
          path: Rota_Unica.apk
          retention-days: 7
