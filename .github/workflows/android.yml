name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile and verify
        run: |
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
          cp app/build/outputs/apk/debug/app-debug.apk Rota_Unica.apk
          test -s Rota_Unica.apk
          sha256sum Rota_Unica.apk
          ls -lh Rota_Unica.apk
          echo "### Rota Única — tamanho do APK" >> "$GITHUB_STEP_SUMMARY"
          du -h Rota_Unica.apk >> "$GITHUB_STEP_SUMMARY"
          unzip -l Rota_Unica.apk | grep -E 'lib/.+\.so
      - uses: actions/upload-artifact@v4
        with:
          name: Rota_Unica
          path: Rota_Unica.apk
          retention-days: 7
 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Rota_Unica
          path: Rota_Unica.apk
          retention-days: 7
